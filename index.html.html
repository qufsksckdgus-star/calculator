<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공학용 계산기 & 그래프</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; padding: 20px; }
    .calculator { width: 380px; background-color: #22252d; border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .display { width: 100%; height: 100px; background-color: #292d36; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 15px; word-break: break-all; }
    .display-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .indicators { display: flex; gap: 6px; }
    .mode-indicator, .shift-indicator { font-size: 12px; font-weight: bold; border-radius: 4px; padding: 2px 6px; }
    .mode-indicator { color: #26e7a6; background-color: #22252d; }
    .shift-indicator { color: #f39c12; background-color: #22252d; display: none; }
    .display .expression { font-size: 13px; color: #888; text-align: right; }
    .display .result { font-size: 28px; color: #ffffff; font-weight: bold; text-align: right; }
    .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    button { height: 48px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; background-color: #292d36; color: #ffffff; }
    button:hover { background-color: #353b47; }
    button.shift-btn { background-color: #f39c12; }
    button.mode-btn, button.operator, button.equal { background-color: #eb6666; }
    button.func, button.clear { color: #26e7a6; }
    button.graph-btn { background-color: #3498db; }
    .graph-container { width: 380px; background-color: #22252d; border-radius: 20px; padding: 15px; margin-top: 15px; }
    canvas { background-color: #292d36; border-radius: 10px; }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-header">
      <div class="indicators">
        <span class="mode-indicator" id="mode-indicator">DEG</span>
        <span class="shift-indicator" id="shift-indicator">2nd</span>
      </div>
      <div class="expression" id="expression"></div>
    </div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <button class="shift-btn" onclick="toggleShift()" id="shift-btn">2nd</button>
    <button class="mode-btn" onclick="toggleAngleMode()" id="mode-toggle-btn">DEG</button>
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="deleteLast()">⌫</button>
    <button class="operator" onclick="appendCharacter('/')">÷</button>

    <button class="func" onclick="handleTrigInput('sin')" id="btn-sin">sin</button>
    <button class="func" onclick="handleTrigInput('cos')" id="btn-cos">cos</button>
    <button class="func" onclick="handleTrigInput('tan')" id="btn-tan">tan</button>
    <button class="func" onclick="appendCharacter('(')">(</button>
    <button class="func" onclick="appendCharacter(')')">)</button>

    <button class="func" onclick="appendCharacter('√(')">√</button>
    <button class="func" onclick="appendCharacter('log(')">log</button>
    <button class="func" onclick="appendCharacter('ln(')">ln</button>
    <button class="func" onclick="appendCharacter('^')">x^y</button>
    <button class="operator" onclick="appendCharacter('*')">×</button>

    <button onclick="appendCharacter('7')">7</button>
    <button onclick="appendCharacter('8')">8</button>
    <button onclick="appendCharacter('9')">9</button>
    <button class="func" onclick="appendCharacter('x')">x</button>
    <button class="operator" onclick="appendCharacter('-')">-</button>

    <button onclick="appendCharacter('4')">4</button>
    <button onclick="appendCharacter('5')">5</button>
    <button onclick="appendCharacter('6')">6</button>
    <button class="func" onclick="appendCharacter('π')">π</button>
    <button class="operator" onclick="appendCharacter('+')">+</button>

    <button onclick="appendCharacter('1')">1</button>
    <button onclick="appendCharacter('2')">2</button>
    <button onclick="appendCharacter('3')">3</button>
    <button class="graph-btn" onclick="drawGraph()">그래프</button>
    <button class="equal" onclick="calculate()">=</button>

    <button onclick="appendCharacter('0')" style="grid-column: span 2;">0</button>
    <button onclick="appendCharacter('.')">.</button>
    <button class="func" onclick="appendCharacter('e')" style="grid-column: span 2;">e</button>
  </div>
</div>

<div class="graph-container">
  <canvas id="graphCanvas"></canvas>
</div>

<script>
  const resultDisplay = document.getElementById('result');
  const expressionDisplay = document.getElementById('expression');
  const modeIndicator = document.getElementById('mode-indicator');
  const shiftIndicator = document.getElementById('shift-indicator');
  const shiftBtn = document.getElementById('shift-btn');
  const modeToggleBtn = document.getElementById('mode-toggle-btn');
  
  const btnSin = document.getElementById('btn-sin');
  const btnCos = document.getElementById('btn-cos');
  const btnTan = document.getElementById('btn-tan');

  let currentInput = '';
  let isDegree = true;
  let isShift = false;
  let chartInstance = null;

  function toggleAngleMode() {
    isDegree = !isDegree;
    modeIndicator.innerText = isDegree ? 'DEG' : 'RAD';
    modeToggleBtn.innerText = isDegree ? 'DEG' : 'RAD';
  }

  function toggleShift() {
    isShift = !isShift;
    if (isShift) {
      shiftIndicator.style.display = 'inline-block';
      shiftBtn.style.backgroundColor = '#d35400';
      btnSin.innerText = 'asin';
      btnCos.innerText = 'acos';
      btnTan.innerText = 'atan';
    } else {
      shiftIndicator.style.display = 'none';
      shiftBtn.style.backgroundColor = '#f39c12';
      btnSin.innerText = 'sin';
      btnCos.innerText = 'cos';
      btnTan.innerText = 'tan';
    }
  }

  function handleTrigInput(type) {
    if (isShift) {
      appendCharacter('a' + type + '(');
      toggleShift();
    } else {
      appendCharacter(type + '(');
    }
  }

  function appendCharacter(char) {
    if (resultDisplay.innerText === '0' && !isNaN(char)) currentInput = char;
    else currentInput += char;
    updateDisplay();
  }

  function clearDisplay() { currentInput = ''; expressionDisplay.innerText = ''; resultDisplay.innerText = '0'; }
  function deleteLast() { currentInput = currentInput.slice(0, -1); updateDisplay(); }
  function updateDisplay() { resultDisplay.innerText = currentInput === '' ? '0' : currentInput; }

  function mySin(x) { return Math.sin(isDegree ? (x * Math.PI / 180) : x); }
  function myCos(x) { return Math.cos(isDegree ? (x * Math.PI / 180) : x); }
  function myTan(x) { return Math.tan(isDegree ? (x * Math.PI / 180) : x); }
  function myAsin(x) { const r = Math.asin(x); return isDegree ? (r * 180 / Math.PI) : r; }
  function myAcos(x) { const r = Math.acos(x); return isDegree ? (r * 180 / Math.PI) : r; }
  function myAtan(x) { const r = Math.atan(x); return isDegree ? (r * 180 / Math.PI) : r; }

  function parseExpression(inputStr, xVal = null) {
    let expr = inputStr;
    if (xVal !== null) expr = expr.replace(/x/g, `(${xVal})`);

    // 충돌 방지를 위해 역삼각함수를 임시 문자로 1차 치환
    expr = expr.replace(/asin\(/g, 'TEMP_ASIN(')
               .replace(/acos\(/g, 'TEMP_ACOS(')
               .replace(/atan\(/g, 'TEMP_ATAN(');
               
    // 일반 삼각함수 치환
    expr = expr.replace(/sin\(/g, 'mySin(')
               .replace(/cos\(/g, 'myCos(')
               .replace(/tan\(/g, 'myTan(');
               
    // 임시 문자를 실제 함수로 2차 치환
    expr = expr.replace(/TEMP_ASIN\(/g, 'myAsin(')
               .replace(/TEMP_ACOS\(/g, 'myAcos(')
               .replace(/TEMP_ATAN\(/g, 'myAtan(');

    expr = expr.replace(/×/g, '*')
               .replace(/÷/g, '/')
               .replace(/π/g, 'Math.PI')
               .replace(/e/g, 'Math.E')
               .replace(/√\(/g, 'Math.sqrt(')
               .replace(/√([0-9.]+)/g, 'Math.sqrt($1)')
               .replace(/log\(/g, 'Math.log10(')
               .replace(/ln\(/g, 'Math.log(')
               .replace(/\^/g, '**');

    const open = (expr.match(/\(/g) || []).length;
    const close = (expr.match(/\)/g) || []).length;
    if (open > close) expr += ')'.repeat(open - close);

    return expr;
  }

  function calculate() {
    try {
      expressionDisplay.innerText = currentInput;
      const calcFn = new Function('mySin', 'myCos', 'myTan', 'myAsin', 'myAcos', 'myAtan', `return ${parseExpression(currentInput)};`);
      let result = calcFn(mySin, myCos, myTan, myAsin, myAcos, myAtan);
      if (typeof result === 'number') result = Number(result.toFixed(10));
      resultDisplay.innerText = (isNaN(result) || !isFinite(result)) ? '오류' : result;
      currentInput = resultDisplay.innerText;
    } catch (e) {
      resultDisplay.innerText = '오류';
      currentInput = '';
    }
  }

  function drawGraph() {
    if (!currentInput) return;
    const xVals = [], yVals = [];
    for (let x = -10; x <= 10; x += 0.2) {
      try {
        const calcFn = new Function('mySin', 'myCos', 'myTan', 'myAsin', 'myAcos', 'myAtan', `return ${parseExpression(currentInput, x)};`);
        let y = calcFn(mySin, myCos, myTan, myAsin, myAcos, myAtan);
        xVals.push(x.toFixed(1));
        yVals.push((isNaN(y) || !isFinite(y)) ? null : y);
      } catch {
        xVals.push(x.toFixed(1));
        yVals.push(null);
      }
    }
    const ctx = document.getElementById('graphCanvas').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: xVals, datasets: [{ label: `f(x) = ${currentInput}`, data: yVals, borderColor: '#26e7a6', borderWidth: 2, fill: false, pointRadius: 0 }] },
      options: { responsive: true, scales: { x: { grid: { color: '#3d4351' }, ticks: { color: '#888' } }, y: { grid: { color: '#3d4351' }, ticks: { color: '#888' } } }, plugins: { legend: { labels: { color: '#ffffff' } } } }
    });
  }
</script>

</body>
</html>
